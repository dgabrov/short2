{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shortener - {{.Title}}</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="header">
    <div class="left">
        <span class="icon"></span>
        URL Shortener {{if .IsLoggedIn}}<a href="/logout">logout</a>{{end}}
    </div>
    <div class="right">{{if .IsLoggedIn}}{{.FullName}} ({{.Login}}){{else}}not logged in{{end}}</div>
</div>
{{if .Error}}
<div class="error">
    {{.Error}}
</div>
{{end}}
{{template "content" .}}
</body>
</html>
{{end}}
