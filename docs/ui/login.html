<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shortener - Login</title>
    <link rel="stylesheet" href="include/style.css">
</head>
<body>
<div class="header">
    <div class="left">
        <span class="icon"></span>
        URL Shortener
    </div>
    <div class="right">not logged in</div>
</div>
<div class="content">
    <h2>Login</h2>
    <form action="/login">
    <table>
        <tr>
            <td>Login:</td>
            <td><input name="login" type="text"></td>
        </tr>
        <tr>
            <td>Password:</td>
            <td><input name="password" type="password"></td>
        </tr>
        <tr>
            <td>&nbsp;</td>
            <td><button type="submit">Submit</button></td>
        </tr>
    </table>
    </form>
</div>
</body>
</html>
